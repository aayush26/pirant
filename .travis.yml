language: python

python:
  - 2.7
  - 3.3
  - 3.4
  # PyPy versions
  - pypy  # PyPy2 2.5.0
  - pypy3 # Pypy3 2.4.0
  - pypy-5.3.1

install:
  - pip install pylint pydocstyle
  - pip install -U setuptools
  - pip install -e .
  - pip install -r requirements-dev.txt

script:
  - pytest tests
  - coverage run --source=pirant setup.py test

jobs:
  include:
    - stage: Linting
      python: 3.6
      script: pylint --rcfile=pylint.rc pirant
      script: pydocstyle pirant
    - stage: Deploy
      script: skip
      deploy:
        provider: pypi
        user: USERNAME
        password:
          secure: YOUR_ENCRYPTED_PASSWORD
        distributions: "bdist_wheel"
        on:
          tags: true
          python: 3.6
      if: branch = master

stages:
  - Linting
  - Test
  - Deploy

after_success:
  - coveralls
